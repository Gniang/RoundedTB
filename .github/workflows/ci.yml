name: ci

# Build verification only. This repository is a fork with no delivery path,
# so there is deliberately no release, publish, or artifact-upload step here.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: build-windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore RoundedTB.sln

      - name: Build
        run: dotnet build RoundedTB.sln --configuration Release --no-restore
