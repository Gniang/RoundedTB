name: release

# Tag-driven only. A normal push must never reach this workflow - ci.yml is the
# one that runs on every push, and it stays build-verification only.
on:
  push:
    tags:
      - 'v*'
      - 'canary*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name to build as (used for the archive name only)'
        required: true
        default: 'canary-test'

permissions:
  contents: write   # required to create the release; the default read gives 403

jobs:
  release:
    name: release-windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Resolve tag
        id: ver
        shell: pwsh
        run: |
          $tag = if ('${{ github.event_name }}' -eq 'workflow_dispatch') { '${{ inputs.tag }}' } else { '${{ github.ref_name }}' }
          "tag=$tag" >> $env:GITHUB_OUTPUT

      # Self-contained, single file. Compression is not optional here: without it the
      # exe is ~177 MB instead of ~79 MB. Trimming is unavailable - WPF does not support it.
      - name: Publish (self-contained)
        run: >
          dotnet publish RoundedTB/RoundedTB.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=none
          -o publish/RoundedTB

      # Five native WPF DLLs stay outside the single file, so shipping the bare exe
      # produces something that does not start. Always archive the whole folder.
      - name: Archive
        shell: pwsh
        run: |
          Compress-Archive -Path publish/RoundedTB -DestinationPath "RoundedTB_${{ steps.ver.outputs.tag }}_win-x64.zip"

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          draft: true
          generate_release_notes: true
          body: |
            Self-contained build for Windows x64 - no .NET runtime needed.
            Extract the whole `RoundedTB` folder and run `RoundedTB.exe`; the exe
            will not start on its own without the DLLs next to it.

            The binary is unsigned, so SmartScreen will warn on first run.
          files: RoundedTB_*_win-x64.zip
