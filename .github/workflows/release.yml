name: release

# Tag-driven only. A normal push must never reach this workflow - ci.yml is the
# one that runs on every push, and it stays build-verification only.
on:
  push:
    tags:
      - 'v*'
      - 'canary*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name to build as (used for the archive name only)'
        required: true
        default: 'canary-test'

permissions:
  contents: write   # required to create the release; the default read gives 403

jobs:
  release:
    name: release-windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Resolve tag
        id: ver
        shell: pwsh
        run: |
          $tag = if ('${{ github.event_name }}' -eq 'workflow_dispatch') { '${{ inputs.tag }}' } else { '${{ github.ref_name }}' }
          "tag=$tag" >> $env:GITHUB_OUTPUT

      # Self-contained, single file. Compression is not optional here: without it the
      - name: Publish (self-contained)
        run: >
          dotnet publish RoundedTB/RoundedTB.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=none
          -o publish/RoundedTB

      # WPF DLLs isolated; single EXE fails. Always archive the whole folder.
      - name: Archive
        shell: pwsh
        run: |
          Compress-Archive -Path publish/RoundedTB -DestinationPath "RoundedTB_${{ steps.ver.outputs.tag }}_win-x64.zip"

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          draft: true
          generate_release_notes: true
          body: |
            <!-- Write the "## changes <date>" section here, above this line. -->

            <br />
            <br />
            <br />


            ## List of past changes from the original (torchgm's RoundedTB)

            Feature

            * Added a setting for the secondary monitor's clock.
              * You choose the width of the clock (and widget) area.

            Fix

            * Supported 22H2 or later.
            * Fixed the widget area setting not working.

            ## Note to those who used the original version

            #### If the app will not launch

            Old settings files are converted automatically as of this build, so the previous
            workaround (renaming `rtb.json`) is no longer needed. If it still fails to start,
            rename `%LOCALAPPDATA%\RoundedTB\rtb.json` and open an issue with the details.

            #### File size

            The app is large, as a result of solving the following:

            1. runnable on vanilla Windows 11.
            2. enable setting the "Run at startup" option.

            Windows 11 does not include the .NET 10 runtime, so this app ships with the runtime
            inside it. That is where the size comes from.

            I could not make a runtime-less version, because it produces two files, a dll and an
            exe, with the real body in the dll. That triggers the
            ['"Run at startup" option is not working'](https://github.com/torchgm/RoundedTB/issues/268) issue.

            #### SmartScreen

            The exe is not code-signed, so SmartScreen will warn the first time you run it.
          files: RoundedTB_*_win-x64.zip
